<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- The repo's social preview: the pedestal mark from the palette's neofetch, in the site's dark tokens. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0019ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0019ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#030015"/>
  <ellipse cx="300" cy="330" rx="260" ry="220" fill="url(#glow)"/>
  <!-- The pedestal: a box on a wider slab, like the ASCII art. -->
  <g fill="none" stroke="#f0f0f0" stroke-width="4" stroke-linejoin="round">
    <rect x="220" y="196" width="160" height="150" rx="14"/>
    <rect x="170" y="346" width="260" height="34" rx="10"/>
  </g>
  <text x="300" y="296" text-anchor="middle" font-family="Albert Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="88" font-weight="500" fill="#f0f0f0">P</text>
  <!-- Wordmark and tagline. -->
  <text x="520" y="298" font-family="Albert Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="112" font-weight="600" letter-spacing="-3" fill="#f0f0f0">Plinth</text>
  <text x="522" y="358" font-family="Albert Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#a5a5a5">A developer portfolio you make your own</text>
  <text x="522" y="400" font-family="Albert Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#a5a5a5">by editing one file.</text>
  <text x="522" y="470" font-family="Albert Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#f0f0f0">by @leigharriane</text>
</svg>

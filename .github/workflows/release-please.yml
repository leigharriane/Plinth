# Keeps a release PR open that collects every change merged into main.
# Merging that PR bumps the version, updates CHANGELOG.md and publishes the GitHub release.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# Runs Lighthouse on every page of a production build and fails the pull request if a
# score or size budget in lighthouserc.cjs is missed. The HTML reports are attached to
# the run as an artifact.
name: Lighthouse

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Lets the about section's GitHub repos load without hitting the shared runner's rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
